controller_manager:
  ros__parameters:
    update_rate: 100

    base_controller:
      type: dog8Dof/baseController

base_controller:
  ros__parameters:
    robotName: dog
    standProfile: $(find dog_bringup)/parameters/stand.yaml
    walkProfile: $(find dog_bringup)/parameters/walk.yaml
    jumpProfile: $(find dog_bringup)/parameters/jumpLegacy.yaml

    idleTipX: 0.0
    idleTipZ: 250.0

    commandTopic: /dog/command