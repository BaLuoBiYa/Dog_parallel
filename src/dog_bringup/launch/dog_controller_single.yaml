controller_manager:
  ros__parameters:
    update_rate: 250

    base_controller:
      type: dog8Dof/singleController

base_controller:
  ros__parameters:
    robotName: dog
    standProfile: $(find dog_bringup)/parameters/stand.yaml
    walkProfile: $(find dog_bringup)/parameters/walk.yaml
    jumpProfile: $(find dog_bringup)/parameters/jump.yaml

    idleTipX: 0.0
    idleTipZ: 200.0
    commandTopic: /dog/command