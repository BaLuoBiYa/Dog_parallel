# ══════════════════════════════════════════════════════════════════════════════
# JoyStickController 参数配置文件
# 用法: ros2 run dog_remote joystickController --ros-args --params-file <本文件路径>
# ══════════════════════════════════════════════════════════════════════════════

joystick_controller:
  ros__parameters:

    # ── 手柄设备 ──
    device_path: "/dev/input/js0"     # 手柄设备路径
    poll_rate: 200.0                  # 轮询频率 (Hz)

    # ── 调试 ──
    debug_mode: true                  # 是否启用状态打印

    # ── 摇杆映射 ──
    deadzone: 0.10                    # 摇杆死区 (归一化后, 0.0~1.0)
    exponent: 1.5                     # 非线性响应指数 (>1 小幅度更细腻)

    # ── 速度限制 ──
    max_linear_vel: 0.8               # 最大线速度 (m/s)
    max_angular_vel: 0.3              # 最大角速度 (rad/s)

    # ── 身高参数 (单位: mm) ──
    body_height: 200                  # 初始身高
    height_step: 10                   # 身高单次调节步长 (十字键)
    max_body_height: 250              # 身高上限
    min_body_height: 150              # 身高下限

    # ── 步高参数 (单位: mm) ──
    step_height: 100                  # 初始步高
    step_height_step: 10              # 步高单次调节步长 (LB/RB)
    max_step_height: 200              # 步高上限
    min_step_height: 50              # 步高下限

    # ── 步频参数 ──
    step_duration: 0.50               # 初始步频周期 (s), 越小步频越高
    step_duration_step: 0.02          # 步频周期单次调节步长 (十字键左右)

    # ── YAML 热加载 ──
    yaml_path: "src/dog_remote/parameters/JoystickerController.yaml"
    yaml_watch_interval: 1.0          # 文件变化检查间隔 (s) 
