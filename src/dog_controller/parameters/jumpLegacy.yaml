# Profile for jumping over high walls
high_wall:
  enable_gravity_compensation: false
  body_mass: 2.0
  acc_ff_gain_x: 0.0
  acc_ff_gain_z: 0.001

  # Trajectory Parameters
  base_height: 180.0
  crouch_depth: 90.0
  crouch_duration: 1.5
  crouch_forward_dist: 20.0

  push_duration: 0.1
  push_stroke: 180.0
  push_exponent_z: 3.0
  push_x_mode: "smooth"
  push_exponent_x: 2.0
  push_backward_dist: 120.0
  push_velocity_gain: 1.0

  takeoff_pos_ratio: 0.9

  flight_duration: 0.3
  flight_apex_z_offset: 100.0
  flight_landing_debounce_time: 0.7

  land_duration: 1.0
  landing_prep_x: 80.0
  contact_force_threshold: 15.0
  
  # Control Parameters
  kp_crouch: 0.6
  kd_crouch: 0.01
  kp_push: 1.2
  kd_push: 0.01
  kp_flight: 0.3
  kd_flight: 0.01
  kp_land: 0.3
  kd_land: 0.05


